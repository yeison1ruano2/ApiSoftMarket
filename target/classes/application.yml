spring:
  datasource:
    url: ${DBURL}
    username: ${DBUSERNAME}
    password: ${DBPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 180000
      max-lifetime: 300000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      validation-timeout: 3000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: false
  webflux:
    timeout: 60s
  reactor:
    netty:
      connection-timeout: 20s
      read-timeout: 60s
      write-timeout: 60s

      pool:
        max-connections: 50
        max-idle-time: 15s
        max-life-time: 30s
        acquire-timeout: 30s
        evict-in-background: 5s

server:
  port: 8080
  error:
    include-message: always

external-api:
  connection:
    timeout: 20s
    read-timeout: 60s
    max-retries: 1
    retry-delay: 2s
  authUrl: ${AUTHURL}
  facturaUrl: ${FACTURAURL}
  rangoEnumeracionUrl: ${RANGOENUMERACIONURL}
  descargarFacturaUrl: ${DESCARGARFACTURAURL}
  githubToken: ${GITHUBTOKEN}
  githubOwner: ${GITHUBOWNER}
  githubRepo: ${GITHUBREPO}
  nameAuthorizationGoogle: ${NAMEAUTHORIZATIONGOOGLE}
  urlGithub: ${URLGITHUB}
  folderIdDrive: ${FOLDERIDDRIVE}