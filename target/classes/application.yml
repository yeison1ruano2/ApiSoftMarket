spring:
  datasource:
    url: ${DBURL}
    username: ${DBUSERNAME}
    password: ${DBPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  webflux:
    timeout: 60s

server:
  port: 8080
  error:
    include-message: always

external-api:
  connection:
    timeout: 20s
    read-timeout: 60s
    max-retries: 1
    retry-delay: 2s
  authUrl: ${AUTHURL}
  facturaUrl: ${FACTURAURL}
  rangoEnumeracionUrl: ${RANGOENUMERACIONURL}
  descargarFacturaUrl: ${DESCARGARFACTURAURL}
  githubToken: ${GITHUBTOKEN}
  githubOwner: ${GITHUBOWNER}
  githubRepo: ${GITHUBREPO}
  nameAuthorizationGoogle: ${NAMEAUTHORIZATIONGOOGLE}
  urlGithub: ${URLGITHUB}
  folderIdDrive: ${FOLDERIDDRIVE}

